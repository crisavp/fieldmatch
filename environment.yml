# Optional new environment, including the GRIB C library and plotting.
# conda env create -f environment.yml
# conda activate fieldmatch
# python -m pip install '.[plot]'
name: fieldmatch
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python >=3.10,<3.14
  - numpy >=1.24
  - pandas >=2.0
  - xarray >=2024.1
  - netcdf4 >=1.6
  - eccodes >=2.30
  - cfgrib >=0.9.10
  - pyyaml >=6.0
  - typer >=0.12
  - rich >=13.0
  - matplotlib
  - pip
