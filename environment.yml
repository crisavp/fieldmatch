# Conda environment for matchup.
#
#   conda env create -f environment.yml
#   conda activate matchup
#   pip install -e .
#
# (or just run ./install.sh, which does both and checks the result)
#
# conda-forge is required: eccodes/cfgrib (the ECMWF GRIB engine) are not in
# the defaults channel, and mixing channels is the usual cause of a broken
# GRIB install.
name: matchup
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python >=3.10,<3.14
  # numerics / data
  - numpy >=1.24
  - scipy >=1.10
  - pandas >=2.0
  - xarray >=2024.1
  # file formats
  - netcdf4 >=1.6            # satellite + model netCDF
  - eccodes >=2.30           # ECMWF GRIB C library
  - cfgrib >=0.9.10          # xarray GRIB engine (needs eccodes)
  - pyyaml >=6.0             # campaign / config files
  # plots + CLI
  - matplotlib-base >=3.7
  - typer >=0.12
  - rich >=13.0
  # archive workflow (ASCAT x IFS -> wfetch)
  - joblib >=1.3
  - tqdm >=4.65
  # tests
  - pytest >=7.0
  - pip
