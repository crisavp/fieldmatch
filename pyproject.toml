[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldmatch"
version = "0.3.0"
description = "Collocate observation products with gridded model fields"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "netcdf4",
    "cfgrib",       # GRIB engine; needs the eccodes C library (see environment.yml)
    "pyyaml",
    "typer",
    "rich",
]

[project.optional-dependencies]
plot = ["matplotlib"]
notebook = ["matplotlib", "jupyterlab", "ipykernel"]
dev = ["pytest"]

[project.scripts]
fieldmatch = "fieldmatch.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
