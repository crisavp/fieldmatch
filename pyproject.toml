[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldmatch"
version = "0.5.0"
description = "Collocate observation products with gridded model fields"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "xarray>=2024.1",
    "netcdf4>=1.6",
    "cfgrib>=0.9.10",       # GRIB engine; needs the eccodes C library (see environment.yml)
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
plot = ["matplotlib"]
interactive = ["matplotlib", "ipykernel"]
dev = ["pytest"]

[project.scripts]
fieldmatch = "fieldmatch.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fieldmatch = ["config_example.yaml"]
